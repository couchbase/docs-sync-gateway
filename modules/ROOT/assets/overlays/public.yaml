overlay: 1.0.0

info:
  title: Overlay for Public REST API spec
  version: 1.0.0
  # The `version` property above is the version of this overlay file, not the version of the OpenAPI spec.
  # It is not displayed in the generated documentation and there is no need to update it.
  # This property is required by the OpenAPI overlay schema, otherwise I wouldn't have bothered to include it.

extends: ../attachments/bundled-public.yaml

actions:
  - description: Update introduction
    target: $.info
    update:
      title: Sync Gateway Public REST API
      description: |-
        # Introduction

        Sync Gateway manages access and synchronization between Couchbase Lite and Couchbase Server.
        The Sync Gateway Public REST API is used for client replication.

  - description: Update link to external docs
    target: '$'
    update:
      externalDocs:
        description: ⬆️ Public REST API Overview
        url: rest-api.html
