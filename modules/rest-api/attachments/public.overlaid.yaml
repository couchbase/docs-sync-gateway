        To delete an existing document, provide the document ID (`_id`),
        Revision Tree ID (`_rev`), and set the deletion flag (`_deleted`) to
        true.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                new_edits:
                  description: >-
                    This controls whether to assign new revision identifiers to
                    new edits (`true`) or use the existing ones (`false`).
                  type: boolean
                  default: true
                docs:
                  type: array
                  items:
                    description: The configurable Sync Gateway properties of a document.
                    type: object
                    additionalProperties: true
                    properties:
                      _id:
                        description: The ID of the document.
                        type: string
                      _rev:
                        description: The revision of the document.
                        type: string
                      _exp:
                        description: >-
                          Expiry time after which the document will be purged.
                          The expiration time is set and managed on the
                          Couchbase Server document. The value can be specified
                          in two ways; in ISO-8601 format, for example the 6th
                          of July 2022 at 17:00 in the BST timezone would be
                          `2016-07-06T17:00:00+01:00`; it can also be specified
                          as a numeric Couchbase Server expiry value. Couchbase
                          Server expiry values are specified as Unix time, and
                          if the desired TTL is below 30 days then it can also
                          represent an interval in seconds from the current time
                          (for example, a value of 5 will remove the document 5
                          seconds after it is written to Couchbase Server). The
                          document expiration time is returned in the response
                          of `GET /{db}/{doc} ` when `show_exp=true` is included
                          in the query.


                          As with the existing explicit purge mechanism, this
                          applies only to the local database; it has nothing to
                          do with replication. This expiration time is not
                          propagated when the document is replicated. The purge
                          of the document does not cause it to be deleted on any
                          other database.
                        type: string
                      _deleted:
                        description: >-
                          Whether the document is a tombstone or not. If true,
                          it is a tombstone.
                        type: boolean
                      _revisions:
                        type: object
                        properties:
                          start:
                            description: Prefix number for the latest revision.
                            type: number
                          ids:
                            description: >-
                              Array of valid Revision Tree IDs, in reverse order
                              (latest first).
                            type: array
                            items:
                              type: string
                      _attachments:
                        type: object
                        additionalProperties:
                          x-additionalPropertiesName: attachmentname
                          description: The name of the attachment.
                          type: object
                          properties:
                            content_type:
                              description: Content type of the attachment.
                              type: string
                            data:
                              description: The data in the attachment in base64.
                              type: string
              required:
                - docs
            example:
              new_edits: true
              docs:
                - _id: FooBar
                  foo: bar
                - _id: AliceSettings
                  _rev: 5-832a6db48ed130adadede928aee54576
                  FailedLoginAttempts: 7
                - _id: BobSettings
                  _rev: 1-fa76ba41ee5fdfee1b91fc478ed09e59
                  _deleted: true
      operationId: post_keyspace-_bulk_docs
      tags:
        - Document
      responses:
        '201':
          description: >-
