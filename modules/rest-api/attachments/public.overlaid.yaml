components:
  parameters:
    db:
      name: db
      in: path
      required: true
      schema:
        type: string
      example: db1
      description: The name of the database to run the operation against.
    keyspace:
      name: keyspace
      in: path
      required: true
      schema:
        type: string
      examples:
        default:
          summary: Default scope and collection
          value: db1
          description: Default scope and collection
        namedInDefault:
          summary: Named collection within the default scope
          value: db1.collection1
          description: Named collection within the default scope
        fullyQualified:
          summary: Fully-qualified scope and collection
          value: db1.scope1.collection1
          description: Fully-qualified scope and collection
      description: >-
        The keyspace to run the operation against.


        A keyspace is a dot-separated string, comprised of a database name, and
        optionally a named scope and collection.
    roundtrip:
      name: roundtrip
      in: query
      required: false
      schema:
        type: boolean
      description: Block until document has been received by change cache
    ddoc:
      name: ddoc
      in: path
      required: true
      schema:
        type: string
      description: The design document name.
    view:
      name: view
      in: path
      required: true
      schema:
        type: string
      description: The view to target.
    inclusive_end:
      name: inclusive_end
      in: query
      required: false
      description: >-
        Indicates whether the specified end key should be included in the
        result.
      schema:
        type: boolean
    descending:
      name: descending
      in: query
      required: false
      description: Return documents in descending order.
      schema:
        type: boolean
    include_docs-cbs3:
      name: include_docs
      in: query
      required: false
      description: >-
        Only works when using Couchbase Server 3.0 and earlier. Indicates
        whether to include the full content of the documents in the response.
      schema:
        type: boolean
    reduce:
      name: reduce
      in: query
      required: false
      description: Whether to execute a reduce function on the response or not.
      schema:
        type: boolean
    group:
      name: group
      in: query
      required: false
      description: Group the results using the reduce function to a group or single row.
      schema:
        type: boolean
    skip:
      name: skip
      in: query
      required: false
      description: >-
        Skip the specified number of documents before starting to return
        results.
      schema:
        type: integer
    limit:
      name: limit
      in: query
      required: false
      description: Return only the specified number of documents
      schema:
        type: integer
    group_level:
      name: group_level
      in: query
      required: false
      description: Specify the group level to be used.
      schema:
        type: integer
    startkey_docid:
      name: startkey_docid
      in: query
      required: false
      description: Return documents starting with the specified document identifier.
      schema:
        type: string
    endkey_docid:
      name: endkey_docid
      in: query
      required: false
      description: >-
        Stop returning records when the specified document identifier is
        reached.
      schema:
        type: string
    stale:
      name: stale
      in: query
      required: false
      description: >-
        Allow the results from a stale view to be used, without triggering a
        rebuild of all views within the encompassing design document.
      schema:
        type: string
        enum:
          - ok
          - update_after
    startkey:
      name: startkey
      in: query
      required: false
      schema:
        type: string
      description: Return records starting with the specified key.
    endkey:
      name: endkey
      in: query
      required: false
      schema:
        type: string
      description: Stop returning records when this key is reached.
    key:
      name: key
      in: query
      required: false
      description: Return only the document that matches the specified key.
      schema:
        type: string
    keys:
      name: keys
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      description: An array of document ID strings to filter by.
    docid:
      name: docid
      in: path
      required: true
      schema:
        type: string
      example: doc1
      description: The document ID to run the operation against.
    rev:
      name: rev
      in: query
      required: false
      schema:
        type: string
      example: 2-5145e1086bb8d1d71a531e9f6b543c58
      description: >-
        The document revision to target. This can be a RevTree ID or a CV
        (Current Version) ID. If this is a CV value, ensure the query parameter
        is URL encoded (`+`->`%2B`, `@`->`%40`, etc.)
    open_revs:
      name: open_revs
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      description: >-
        Option to fetch specified revisions of the document. The value can be
        all to fetch all leaf revisions or an array of revision numbers (i.e.
        open_revs=["rev1", "rev2"]). Only leaf revision bodies that haven't been
        pruned are guaranteed to be returned. If this option is specified the
        response will be in multipart format. Use the `Accept: application/json`
        request header to get the result as a JSON object.
    show_exp:
      name: show_exp
      in: query
      required: false
      schema:
        type: boolean
      description: Whether to show the expiry property (`_exp`) in the response.
    revs_from:
      name: revs_from
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      description: >-
        Trim the revision history to stop at the first revision in the provided
        list. If no match is found, the revisions will be trimmed to the
        `revs_limit`.
    atts_since:
      name: atts_since
      in: query
      required: false
      schema:
        type: array
        items:
          type: string
      description: >-
        Include attachments only since specified revisions. Excludes the
        attachments for the specified revisions. Only gets used if
        `attachments=true`.
    revs_limit:
      name: revs_limit
      in: query
      required: false
      schema:
        type: integer
      description: Maximum amount of revisions to return for each document.
    includeAttachments:
      name: attachments
      in: query
      required: false
      schema:
        type: boolean
      description: Include attachment bodies in response.
    replicator2:
      name: replicator2
      in: query
      required: false
      schema:
        type: boolean
      description: >-
        Returns the document with the required properties for replication. This
        is an enterprise-edition only feature.
    new_edits:
      name: new_edits
      in: query
      required: false
      schema:
        type: boolean
        default: true
      description: >-
        Setting this to false indicates that the request body is an
        already-existing revision that should be directly inserted into the
        database, instead of a modification to apply to the current document.
        This mode is used for replication.  This option must be used in
        conjunction with the `_revisions` property in the request body.
    Document-If-Match:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: >-
        An optimistic concurrency control (OCC) value used to prevent conflicts.
        Use the value returned in the ETag response header of the GET request
        for the resource being updated, or the latest known Revision Tree ID or
        Current Version of the document.
    include_docs:
      name: include_docs
      in: query
      required: false
      schema:
        type: boolean
      description: Include the body associated with each document.
    Include-channels:
      name: channels
      in: query
      required: false
      schema:
        type: boolean
      description: >-
        Include the channels each document is part of that the calling user also
        has access too.
    include-access:
      name: access
      in: query
      required: false
      schema:
        type: boolean
      description: Include what user/roles that each document grants access too.
    include-revs:
      name: revs
      in: query
      required: false
      schema:
        type: boolean
      description: >-
        Include all the revisions for each document under the `_revisions`
        property.
    include-seqs:
      name: update_seq
      in: query
      required: false
      schema:
        type: boolean
      description: >-
        Include the document sequence number `update_seq` property for each
        document.
    limit-result-rows:
      name: limit
      in: query
      required: false
      schema:
        type: number
      description: >-
        This limits the number of result rows returned. Using a value of `0` has
        the same effect as the value `1`.
    provider:
      name: provider
      in: query
      required: false
      schema:
        type: string
      description: >-
        The OpenID Connect provider to use for authentication.  The list of
        providers are defined in the Sync Gateway config. If left empty, the
        default provider will be used.
    offline:
      name: offline
      in: query
      required: false
      schema:
        type: string
      description: >-
        If true, the OpenID Connect provider is requested to confirm with the
        user the permissions requested and refresh the OIDC token. To do this,
        access_type=offline and prompt=consent is set on the redirection link.
    oidc-code:
      name: code
      in: query
      required: true
      schema:
        type: string
      description: The OpenID Connect authentication code.
    oidc-state:
      name: state
      in: query
      required: false
      schema:
        type: string
      description: >-
        The OpenID Connect state to verify against the state cookie. This is
        used to prevent cross-site request forgery (CSRF). This is not required
        if `disable_callback_state=true` for the provider config (NOT
        recommended).
    oidc-scope:
      name: scope
      in: query
      required: true
      schema:
        type: string
      description: The OpenID Connect authentication scope.
    oidc-redirect_uri:
      name: redirect_uri
      in: query
      required: false
      schema:
        type: string
      description: The Sync Gateway OpenID Connect callback URL.
  schemas:
    User-session-information:
      type: object
      properties:
        authentication_handlers:
          description: >-
            The ways authentication can be established to authenticate as a
            user. Used for CouchDB compatibility. Always contains "default" and
            "cookie".
          type: array
          enum:
            - - default
              - cookie
          default:
            - default
            - cookie
        ok:
          description: Used for CouchDB compatibility. Always true.
          type: boolean
          enum:
            - true
        userCtx:
          type: object
          properties:
            channels:
              description: >-
                A map of the channels in the default collection that the user is
                in along with the sequence number the user was granted access.
                This does not include inherited channels through roles.
              type: object
              additionalProperties:
                x-additionalPropertiesName: channelName
                type: number
                minimum: 1
                description: The sequence number the user was granted access.
                title: sequence number
              example:
                '!': 1
                channelA: 2
            name:
              description: The name of the user.
              type: string
              minLength: 1
          required:
            - channels
            - name
      required:
        - authentication_handlers
        - ok
        - userCtx
      title: User Session Information
    HTTP-Error:
      type: object
      properties:
        error:
          description: The error name.
          type: string
        reason:
          description: The error description.
          type: string
      required:
        - error
        - reason
      title: HTTP-Error
    DatabaseState:
      description: The state of the database.
      type: string
      enum:
        - Online
        - Offline
        - Starting
        - Stopping
        - Resyncing
      x-enumDescriptions:
        Online: The database is online and available for use.
        Offline: >-
          The database is offline, resync and other offline only endpoints are
          allowed.
        Starting: The database is in the process of going online.
        Stopping: >-
          The database is no longer accepting connections and is being taken
          offline or deleted.
        Resyncing: The database is offline and performing a resync operation.
    Vendor:
      description: Product vendor
      type: object
      properties:
        name:
          description: Product name
          type: string
          example: Couchbase Sync Gateway
        version:
          description: |-
            API version.
            Omitted if `api.hide_product_version=true`
          type: string
          example: 3.1
      required:
        - name
      title: Vendor
    NodeInfo:
      type: object
      properties:
        ADMIN:
          description: '`true` if the request is from the Admin API - otherwise omitted.'
          type: boolean
          example: true
        couchdb:
          description: CouchDB welcome
          type: string
          example: Welcome
        vendor:
          allOf:
            - description: Product vendor
              type: object
              properties:
                name:
                  description: Product name
                  type: string
                  example: Couchbase Sync Gateway
                version:
                  description: |-
                    API version.
                    Omitted if `api.hide_product_version=true`
                  type: string
                  example: 3.1
              required:
                - name
              title: Vendor
        version:
          description: >-
            Product version, including the build number and edition (i.e. `EE`
            or `CE`)

            Omitted if `api.hide_product_version=true`
          type: string
          example: Couchbase Sync Gateway/3.1.0(1;a765231) EE
        persistent_config:
          description: >-
            Indication for whether sync gateway is running in persistent config
            mode or legacy config mode.

            `true` if the sync gateway node is running in persistent config
            mode.
          type: boolean
          example: true
      required:
        - couchdb
        - vendor
    Document:
      description: The configurable Sync Gateway properties of a document.
      type: object
      additionalProperties: true
      properties:
        _id:
          description: The ID of the document.
          type: string
        _rev:
          description: The revision of the document.
          type: string
        _exp:
          description: >-
            Expiry time after which the document will be purged. The expiration
            time is set and managed on the Couchbase Server document. The value
            can be specified in two ways; in ISO-8601 format, for example the
            6th of July 2022 at 17:00 in the BST timezone would be
            `2016-07-06T17:00:00+01:00`; it can also be specified as a numeric
            Couchbase Server expiry value. Couchbase Server expiry values are
            specified as Unix time, and if the desired TTL is below 30 days then
            it can also represent an interval in seconds from the current time
            (for example, a value of 5 will remove the document 5 seconds after
            it is written to Couchbase Server). The document expiration time is
            returned in the response of `GET /{db}/{doc} ` when `show_exp=true`
            is included in the query.


            As with the existing explicit purge mechanism, this applies only to
            the local database; it has nothing to do with replication. This
            expiration time is not propagated when the document is replicated.
            The purge of the document does not cause it to be deleted on any
            other database.
          type: string
        _deleted:
          description: >-
            Whether the document is a tombstone or not. If true, it is a
            tombstone.
          type: boolean
        _revisions:
          type: object
          properties:
            start:
              description: Prefix number for the latest revision.
              type: number
            ids:
              description: >-
                Array of valid Revision Tree IDs, in reverse order (latest
                first).
              type: array
              items:
                type: string
        _attachments:
          type: object
          additionalProperties:
            x-additionalPropertiesName: attachmentname
            description: The name of the attachment.
            type: object
            properties:
              content_type:
                description: Content type of the attachment.
                type: string
              data:
                description: The data in the attachment in base64.
                type: string
    New-revision:
      description: Properties returned when a new document revision is created
      type: object
      properties:
        id:
          description: The ID of the document.
          type: string
        ok:
          description: Whether the request completed successfully.
          type: boolean
        rev:
          description: The Revision Tree ID of the document.
          type: string
        cv:
          description: The CV of the document.
          type: string
      required:
        - id
        - ok
        - rev
      title: New-revision
    Design-doc:
      description: Properties of a design document
      type: object
      properties:
        language:
          type: string
        views:
          type: object
          additionalProperties:
            x-additionalPropertiesName: viewname
            description: The name of the view.
            type: object
            properties:
              map:
                type: string
              reduce:
                type: string
        options:
          type: object
          properties:
            local_seq:
              type: string
            include_design:
              type: string
            raw:
              type: string
            index_xattr_on_deleted_docs:
              type: string
    Changes-feed:
      description: Properties of a changes feed
      type: object
      properties:
        results:
          type: array
          items:
            type: object
            properties:
              seq:
                description: The change sequence number.
                type: number
              id:
                description: The document ID the change happened on.
                type: string
              changes:
                description: >-
                  List of document leafs with each leaf containing only a `rev`
                  or `cv` field.
                type: array
                items:
                  oneOf:
                    - type: object
                      properties:
                        rev:
                          description: >-
                            The Revision Tree ID associated with the change.
                            This may be returned even when the `version_type`
                            preference is set to `cv` if this document was an
                            old revision written prior to upgrading to SG 4.0+
                          type: string
                      title: Revision Tree ID
                    - type: object
                      properties:
                        cv:
                          description: >-
                            The Current Version associated with the change. This
                            value requires the `version_type` preference set to
                            `cv` and this document revision being written
                            through SG 4.0+
                          type: string
                      title: Current Version
                uniqueItems: true
          uniqueItems: true
        last_seq:
          description: The last change sequence number.
          type: string
    OIDC-callback:
      type: object
      properties:
        id_token:
          description: The OpenID Connect ID token
          type: string
        refresh_token:
          description: The OpenID Connect ID refresh token
          type: string
        session_id:
          description: The Sync Gateway session token
          type: string
        name:
          description: The Sync Gateway user
          type: string
        access_token:
          description: The OpenID Connect access token
          type: string
        token_type:
          description: The OpenID Connect ID token type
          type: string
        expires_in:
          description: The time until the id_token expires (TTL).
          type: number
      title: OpenID Connect callback properties
    OIDC-token:
      description: >-
        Properties expected back from an OpenID Connect provider after
        successful authentication
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: string
        id_token:
          type: string
      title: OIDC-token
    OIDC-login-page-handler:
      description: Properties passed from the OpenID Connect mock login page to the handler
      type: object
      properties:
        username:
          type: string
        tokenttl:
          type: string
        identity-token-formats:
          type: string
        authenticated:
          type: string
      required:
        - username
        - tokenttl
        - identity-token-formats
        - authenticated
  responses:
    User-session-information:
      description: Properties associated with a user session
      content:
        application/json:
          schema:
            type: object
            properties:
              authentication_handlers:
                description: >-
                  The ways authentication can be established to authenticate as
                  a user. Used for CouchDB compatibility. Always contains
                  "default" and "cookie".
                type: array
                enum:
                  - - default
                    - cookie
                default:
                  - default
                  - cookie
              ok:
                description: Used for CouchDB compatibility. Always true.
                type: boolean
                enum:
                  - true
              userCtx:
                type: object
                properties:
                  channels:
                    description: >-
                      A map of the channels in the default collection that the
                      user is in along with the sequence number the user was
                      granted access. This does not include inherited channels
                      through roles.
                    type: object
                    additionalProperties:
                      x-additionalPropertiesName: channelName
                      type: number
                      minimum: 1
                      description: The sequence number the user was granted access.
                      title: sequence number
                    example:
                      '!': 1
                      channelA: 2
                  name:
                    description: The name of the user.
                    type: string
                    minLength: 1
                required:
                  - channels
                  - name
            required:
              - authentication_handlers
              - ok
              - userCtx
            title: User Session Information
    Unauthorized:
      description: 'User does not have access to resource, or resource does not exist'
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: The error name.
                type: string
              reason:
                description: The error description.
                type: string
            required:
              - error
              - reason
            title: HTTP-Error
    Invalid-CORS-LoginOrigin:
      description: >-
        Value of `Origin` is not in the approved list of allowed origins in
        `LoginOrigin` of Sync Gateway bootstrap or database configuration.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: The error name.
                type: string
              reason:
                description: The error description.
                type: string
            required:
              - error
              - reason
            title: HTTP-Error
          example:
            error: Bad Request
            reason: No CORS
    Not-found:
      description: Resource could not be found
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: The error name.
                type: string
              reason:
                description: The error description.
                type: string
            required:
              - error
              - reason
            title: HTTP-Error
          example:
            error: not_found
            reason: no such database "invalid-db"
    request-problem:
      description: There was a problem with your request
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: The error name.
                type: string
              reason:
                description: The error description.
                type: string
            required:
              - error
              - reason
            title: HTTP-Error
    Conflict:
      description: Resource already exists under that name
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: The error name.
                type: string
              reason:
                description: The error description.
                type: string
            required:
              - error
              - reason
            title: HTTP-Error
    Invalid-content-type:
      description: Invalid content type
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: The error name.
                type: string
              reason:
                description: The error description.
                type: string
            required:
              - error
              - reason
            title: HTTP-Error
    ddoc-forbidden:
      description: >-
        Forbidden access possibly due to not using the Admin API or the design
        document is a built-in Sync Gateway one.
    invalid-doc-id:
      description: >-
        Document ID is not in an allowed format therefore is invalid.


        This could be because it is over 250 characters or is prefixed with an
        underscore ("_").
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: The error name.
                type: string
              reason:
                description: The error description.
                type: string
            required:
              - error
              - reason
            title: HTTP-Error
    New-revision:
      description: New revision created successfully
      content:
        application/json:
          schema:
            description: Properties returned when a new document revision is created
            type: object
            properties:
              id:
                description: The ID of the document.
                type: string
              ok:
                description: Whether the request completed successfully.
                type: boolean
              rev:
                description: The Revision Tree ID of the document.
                type: string
              cv:
                description: The CV of the document.
                type: string
            required:
              - id
              - ok
              - rev
            title: New-revision
    changes-feed:
      description: Successfully returned the changes feed
      content:
        application/json:
          schema:
            description: Properties of a changes feed
            type: object
            properties:
              results:
                type: array
                items:
                  type: object
                  properties:
                    seq:
                      description: The change sequence number.
                      type: number
                    id:
                      description: The document ID the change happened on.
                      type: string
                    changes:
                      description: >-
                        List of document leafs with each leaf containing only a
                        `rev` or `cv` field.
                      type: array
                      items:
                        oneOf:
                          - type: object
                            properties:
                              rev:
                                description: >-
                                  The Revision Tree ID associated with the
                                  change. This may be returned even when the
                                  `version_type` preference is set to `cv` if
                                  this document was an old revision written
                                  prior to upgrading to SG 4.0+
                                type: string
                            title: Revision Tree ID
                          - type: object
                            properties:
                              cv:
                                description: >-
                                  The Current Version associated with the
                                  change. This value requires the `version_type`
                                  preference set to `cv` and this document
                                  revision being written through SG 4.0+
                                type: string
                            title: Current Version
                      uniqueItems: true
                uniqueItems: true
              last_seq:
                description: The last change sequence number.
                type: string
    all-docs:
      description: Operation ran successfully
      content:
        application/json:
          schema:
            type: object
            properties:
              rows:
                type: array
                items:
                  type: object
                  properties:
                    key:
                      type: string
                    id:
                      type: string
                    value:
                      type: object
                      properties:
                        rev:
                          type: string
                        cv:
                          type: string
                uniqueItems: true
              total_rows:
                type: number
              update_seq:
                type: number
            required:
              - rows
              - total_rows
              - update_seq
    OIDC-invalid-provider:
      description: >-
        The provider provided is not defined in the Sync Gateway config. If no
        provided was specified then there is no default provider set. 
    OIDC-connection:
      description: >-
        Unable to connect and validate with the OpenID Connect provider
        requested
    OIDC-callback:
      description: Successfully authenticated with OpenID Connect.
      content:
        application/json:
          schema:
            type: object
            properties:
              id_token:
                description: The OpenID Connect ID token
                type: string
              refresh_token:
                description: The OpenID Connect ID refresh token
                type: string
              session_id:
                description: The Sync Gateway session token
                type: string
              name:
                description: The Sync Gateway user
                type: string
              access_token:
                description: The OpenID Connect access token
                type: string
              token_type:
                description: The OpenID Connect ID token type
                type: string
              expires_in:
                description: The time until the id_token expires (TTL).
                type: number
            title: OpenID Connect callback properties
    OIDC-test-provider-disabled:
      description: >-
        The OpenID Connect unsupported config option `oidc_test_provider` is not
        enabled. To use this endpoint, this option must be enabled.
    OIDC-invalid-scope:
      description: A validation error occurred with the scope.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: The error name.
                type: string
              reason:
                description: The error description.
                type: string
            required:
              - error
              - reason
            title: HTTP-Error
    OIDC-testing-internal-error:
      description: An error occurred.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                description: The error name.
                type: string
              reason:
                description: The error description.
                type: string
            required:
              - error
