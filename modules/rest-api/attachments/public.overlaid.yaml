    parameters:
      - name: keyspace
        in: path
        required: true
        schema:
          type: string
        examples:
          default:
            summary: Default scope and collection
            value: db1
            description: Default scope and collection
          namedInDefault:
            summary: Named collection within the default scope
            value: db1.collection1
            description: Named collection within the default scope
          fullyQualified:
            summary: Fully-qualified scope and collection
            value: db1.scope1.collection1
            description: Fully-qualified scope and collection
        description: >-
          The keyspace to run the operation against.


          A keyspace is a dot-separated string, comprised of a database name,
          and optionally a named scope and collection.
    get:
      summary: Get changes list
      operationId: get_keyspace-_changes
      tags:
        - Document
      description: >-
        This request retrieves a sorted list of changes made to documents in the
        database, in time order of application. Each document appears at most
        once, ordered by its most recent change, regardless of how many times it
        has been changed.


        This request can be used to listen for update and modifications to the
        database for post processing or synchronization. A continuously
        connected changes feed is a reasonable approach for generating a
        real-time log for most applications.
      parameters:
        - name: limit
          in: query
          description: Maximum number of changes to return.
          schema:
            type: integer
        - name: since
          in: query
          description: >-
            Starts the results from the change immediately after the given
            sequence ID. Sequence IDs should be considered opaque; they come
            from the last_seq property of a prior response.
          schema:
            type: string
        - name: style
          in: query
          description: >-
            Controls whether to return the current winning revision
            (`main_only`) or all the leaf revision including conflicts and
            deleted former conflicts (`all_docs`).
          schema:
            type: string
            default: main_only
            enum:
              - main_only
              - all_docs
        - name: active_only
          in: query
          description: >-
            Set true to exclude deleted documents and notifications for
            documents the user no longer has access to from the changes feed.
          schema:
            type: boolean
            default: false
        - name: include_docs
          in: query
          required: false
          schema:
            type: boolean
          description: Include the body associated with each document.
        - name: revocations
          in: query
          description: 'If true, revocation messages will be sent on the changes feed.'
          schema:
            type: boolean
        - name: filter
          in: query
          description: Set a filter to either filter by channels or document IDs.
          schema:
            type: string
            enum:
              - sync_gateway/bychannel
              - _doc_ids
        - name: channels
          in: query
          description: >-
            A comma-separated list of channel names to filter the response to
            only the channels specified. To use this option, the `filter` query
            option must be set to `sync_gateway/bychannels`.
          schema:
            type: string
        - name: doc_ids
          in: query
          description: >-
            A valid JSON array of document IDs to filter the documents in the
            response to only the documents specified. To use this option, the
            `filter` query option must be set to `_doc_ids` and the `feed`
            parameter must be `normal`. Also accepts a comma separated list of
            document IDs instead.
          schema:
            type: array
            items:
              type: string
        - name: heartbeat
          in: query
          description: >-
            The interval (in milliseconds) to send an empty line (CRLF) in the
            response. This is to help prevent gateways from deciding the socket
            is idle and therefore closing it. This is only applicable to
            `feed=longpoll` or `feed=continuous`. This will override any
            timeouts to keep the feed alive indefinitely. Setting to 0 results
            in no heartbeat. The maximum heartbeat can be set in the server
            replication configuration. If heartbeat is non zero, it must be at
            least 25000 milliseconds.
          schema:
            type: integer
            default: 0
        - name: timeout
          in: query
          description: >-
            This is the maximum period (in milliseconds) to wait for a change
            before the response is sent, even if there are no results. This is
            only applicable for `feed=longpoll` or `feed=continuous` changes
            feeds. Setting to 0 results in no timeout.
          schema:
            type: integer
            default: 300000
            maximum: 900000
            minimum: 0
        - name: feed
          in: query
          description: The type of changes feed to use.
          schema:
            type: string
            default: normal
            enum:
              - normal
              - longpoll
              - continuous
              - websocket
        - name: version_type
          in: query
          description: >-
            The preferred type of document versioning to use for the changes
            feed.
          schema:
            type: string
            default: rev
            enum:
              - rev
              - cv
            x-enumDescriptions:
              rev: >-
                Revision Tree IDs. For example:
                1-293a80ce8f4874724732f27d35b3959a13cd96e0
              cv: >-
                Current Version. For example:
                1854e4e557cc0000@zTWkmBiYZgNQo7BHVZrB/Q
      responses:
        '200':
          description: Successfully returned the changes feed
          content:
            application/json:
              schema:
                description: Properties of a changes feed
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        seq:
                          description: The change sequence number.
                          type: number
                        id:
                          description: The document ID the change happened on.
                          type: string
                        changes:
                          description: >-
                            List of document leafs with each leaf containing
                            only a `rev` or `cv` field.
                          type: array
                          items:
                            oneOf:
                              - type: object
                                properties:
                                  rev:
                                    description: >-
                                      The Revision Tree ID associated with the
                                      change. This may be returned even when the
                                      `version_type` preference is set to `cv`
                                      if this document was an old revision
                                      written prior to upgrading to SG 4.0+
                                    type: string
                                title: Revision Tree ID
                              - type: object
                                properties:
                                  cv:
                                    description: >-
                                      The Current Version associated with the
                                      change. This value requires the
                                      `version_type` preference set to `cv` and
                                      this document revision being written
                                      through SG 4.0+
                                    type: string
                                title: Current Version
                          uniqueItems: true
                    uniqueItems: true
                  last_seq:
                    description: The last change sequence number.
                    type: string
        '400':
          description: There was a problem with your request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
        '404':
          description: Resource could not be found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
              example:
                error: not_found
                reason: no such database "invalid-db"
