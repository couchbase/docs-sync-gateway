    put:
      summary: Upsert a document
      operationId: put_keyspace-docid
      tags:
        - Document
      description: >-
        This will upsert a document meaning if it does not exist, then it will
        be created. Otherwise a new revision will be made for the existing
        document. A revision ID must be provided if targetting an existing
        document.


        A document ID must be specified for this endpoint. To let Sync Gateway
        generate the ID, use the `POST /{db}/` endpoint.


        If a document does exist, then replace the document content with the
        request body. This means unspecified fields will be removed in the new
        revision.


        The maximum size for a document is 20MB.
      parameters:
        - name: roundtrip
          in: query
          required: false
          schema:
            type: boolean
          description: Block until document has been received by change cache
        - name: replicator2
          in: query
          required: false
          schema:
            type: boolean
          description: >-
            Returns the document with the required properties for replication.
            This is an enterprise-edition only feature.
