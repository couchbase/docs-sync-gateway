            Each object in the returned array represents a document. Each
            document should be checked to make sure it was successfully added to
            the database.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      description: >-
                        The ID of the document that the operation was performed
                        on.
                      type: string
                    rev:
                      description: >-
                        The new revision of the document if the operation was a
                        success.
                      type: string
                    error:
                      description: The error type if the operation of the document failed.
                      type: string
                    reason:
                      description: The reason the operation failed.
                      type: string
                    status:
                      description: The HTTP status code for why the operation failed.
                      type: integer
                  required:
                    - id
                uniqueItems: true
              examples:
                Success:
                  value:
                    - id: FooBar
                      rev: 1-cd809becc169215072fd567eebd8b8de
                    - id: AliceSettings
                      rev: 6-b3e8dcf825b71ccee112f3572ec4323c
                    - id: BobSettings
                      rev: 2-5145e1086bb8d1d71a531e9f6b543c58
                PartialSuccess:
