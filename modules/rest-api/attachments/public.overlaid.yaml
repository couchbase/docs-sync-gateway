        in: path
        description: >-
          The attachment name. This value must be URL encoded. For example, if
          the attachment name is `blob_/avatar`, the path component passed to
          the URL should be `blob_%2Favatar` (tested with
          [URLEncoder](https://www.urlencoder.org/)).
        required: true
        schema:
          type: string
    get:
      summary: Get an attachment from a document
      operationId: get_keyspace-docid-attach
      tags:
        - Document Attachment
      description: >-
        This request retrieves a file attachment associated with the document.


        The raw data of the associated attachment is returned (just as if you
        were accessing a static file). The `Content-Type` response header is the
        same content type set when the document attachment was added to the
        database. The `Content-Disposition` response header will be set if the
        content type is considered unsafe to display in a browser (unless
        overridden by by database config option
        `serve_insecure_attachment_types`) which will force the attachment to be
        downloaded.


        If the `meta` query parameter is set then the response will be in JSON
        with the additional metadata tags.
      parameters:
        - name: rev
          in: query
          required: false
          schema:
            type: string
          example: 2-5145e1086bb8d1d71a531e9f6b543c58
          description: >-
            The document revision to target. This can be a RevTree ID or a CV
            (Current Version) ID. If this is a CV value, ensure the query
            parameter is URL encoded (`+`->`%2B`, `@`->`%40`, etc.)
        - name: content_encoding
          in: query
          description: Set to false to disable the `Content-Encoding` response header.
