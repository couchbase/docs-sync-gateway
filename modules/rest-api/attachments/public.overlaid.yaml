openapi: 3.0.3
info:
  title: Sync Gateway Public REST API
  description: >-
    # Introduction


    Sync Gateway manages access and synchronization between Couchbase Lite and
    Couchbase Server.

    The Sync Gateway Public REST API is used for client replication.
  version: '4.0'
  license:
    name: Business Source License 1.1 (BSL)
    url: 'https://github.com/couchbase/sync_gateway/blob/master/LICENSE'
servers:
  - url: '{protocol}://{hostname}:4984'
    description: Public API
    variables:
      protocol:
        description: The protocol to use (HTTP or HTTPS)
        default: http
        enum:
          - http
          - https
      hostname:
        description: The hostname to use
        default: localhost
tags:
  - name: Server
    description: Manage server activities
  - name: Database Management
    description: Create and manage Sync Gateway databases
  - name: Session
    description: Manage user sessions
  - name: Authentication
    description: Manage OpenID Connect Authentication
  - name: Document
    description: Create and manage documents
  - name: Document Attachment
    description: Create and manage document attachments
  - name: Replication
    description: Create and manage inter-Sync Gateway replications
    x-capella: false
  - name: Unsupported
    description: Endpoints that are not supported by Sync Gateway
    x-capella: false
externalDocs:
  description: ⬆️ Public REST API Overview
  url: rest-api.html
paths:
  '/{db}/_session':
    parameters:
      - name: db
        in: path
        required: true
        schema:
          type: string
        example: db1
        description: The name of the database to run the operation against.
    get:
      summary: Get information about the current user
      operationId: get_db-_session
      tags:
        - Session
      description: This will get the information about the current user.
      responses:
        '200':
          description: Properties associated with a user session
          content:
            application/json:
              schema:
                type: object
                properties:
                  authentication_handlers:
                    description: >-
                      The ways authentication can be established to authenticate
                      as a user. Used for CouchDB compatibility. Always contains
                      "default" and "cookie".
                    type: array
                    enum:
                      - - default
                        - cookie
                    default:
                      - default
                      - cookie
                  ok:
                    description: Used for CouchDB compatibility. Always true.
                    type: boolean
                    enum:
                      - true
                  userCtx:
                    type: object
                    properties:
                      channels:
                        description: >-
                          A map of the channels in the default collection that
                          the user is in along with the sequence number the user
                          was granted access. This does not include inherited
                          channels through roles.
                        type: object
                        additionalProperties:
                          x-additionalPropertiesName: channelName
                          type: number
                          minimum: 1
                          description: The sequence number the user was granted access.
                          title: sequence number
                        example:
                          '!': 1
                          channelA: 2
                      name:
                        description: The name of the user.
                        type: string
                        minLength: 1
                    required:
                      - channels
                      - name
                required:
                  - authentication_handlers
                  - ok
                  - userCtx
                title: User Session Information
        '401':
          description: 'User does not have access to resource, or resource does not exist'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
    post:
      summary: Create a new user session
      operationId: post_db-_session
      tags:
        - Session
      description: >-
        Generates a login session for the user based on the credentials provided
        in the request body or if that fails (due to invalid credentials or none
        provided at all), generates the new session for the currently
        authenticated user instead. On a successful session creation, a session
        cookie is stored to keep the user authenticated for future API calls.


        If `Origin` header is passed to this endpoint, the `Origin` header must
        match both the `cors.login_origin` and `cors.origin` configuration
        options.
      parameters:
        - name: one_time
          description: >-
            Sets the session to only be valid for a single authentication. This
            session will expire in 5 minutes if not used.
          in: query
          schema:
            type: boolean
      requestBody:
        description: >-
          When name and password are included in the request body, the session
          will be created for the specified user.  Otherwise the session will be
          created for the authenticated user making the request.
        required: false
        content:
          application/json:
            schema:
              type: object
              title: User Credentials
              properties:
                name:
                  description: >-
                    User name to generate the session for. Omit this value to
                    generate a session for the authenticated user.
                  type: string
                password:
                  description: >-
                    Password of the user to generate the session for. Omit this
                    value to generate a session for the authenticated user.
                  type: string
      responses:
        '200':
          description: >-
            Session created successfully. Returned body is dependant on if using
            Public or Admin APIs
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      authentication_handlers:
                        description: >-
                          The ways authentication can be established to
                          authenticate as a user. Used for CouchDB
                          compatibility. Always contains "default" and "cookie".
                        type: array
                        enum:
                          - - default
                            - cookie
                        default:
                          - default
                          - cookie
                      ok:
                        description: Used for CouchDB compatibility. Always true.
                        type: boolean
                        enum:
                          - true
                      userCtx:
                        type: object
                        properties:
                          channels:
                            description: >-
                              A map of the channels in the default collection
                              that the user is in along with the sequence number
                              the user was granted access. This does not include
                              inherited channels through roles.
                            type: object
                            additionalProperties:
                              x-additionalPropertiesName: channelName
                              type: number
                              minimum: 1
                              description: The sequence number the user was granted access.
                              title: sequence number
                            example:
                              '!': 1
                              channelA: 2
                          name:
                            description: The name of the user.
                            type: string
                            minLength: 1
                        required:
                          - channels
                          - name
                    required:
                      - authentication_handlers
                      - ok
                      - userCtx
                    title: User Session Information
                  - type: object
                    properties:
                      one_time_session_id:
                        description: >-
                          The id of a single use session if `one_time=true`
                          query parameter was used.
                        type: string
                        example: c5af80a039db4ed9d2b6865576b6999935282689
        '400':
          description: >-
            Value of `Origin` is not in the approved list of allowed origins in
            `LoginOrigin` of Sync Gateway bootstrap or database configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
              example:
                error: Bad Request
                reason: No CORS
        '401':
          description: 'User does not have access to resource, or resource does not exist'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
    delete:
      summary: Log out
      operationId: delete_db-_session
      tags:
        - Session
      description: >-
        Invalidates the session for the currently authenticated user and removes
        their session cookie.


        If `Origin` header is passed to this endpoint, the `Origin` header must
        match both the `cors.login_origin` and `cors.origin` configuration
        options.
      responses:
        '200':
          description: Successfully removed session (logged out)
        '400':
          description: >-
            Value of `Origin` is not in the approved list of allowed origins in
            `LoginOrigin` of Sync Gateway bootstrap or database configuration.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
              example:
                error: Bad Request
                reason: No CORS
        '401':
          description: 'User does not have access to resource, or resource does not exist'
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
        '404':
          description: Return if session not found.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
              example:
                error: not_found
                reason: no session
  '/{db}/':
    parameters:
      - name: db
        in: path
        required: true
        schema:
          type: string
        example: db1
        description: The name of the database to run the operation against.
    get:
      summary: Get database information
      operationId: get_db-
      tags:
        - Database Management
      description: Retrieve information about the database.
      responses:
        '200':
          description: Successfully returned database information
          content:
            application/json:
              schema:
                type: object
                properties:
                  db_name:
                    description: Database name
                    type: string
                    example: db
                  update_seq:
                    description: >-
                      The last sequence number that was committed to the
                      database.


                      Will return 0 if the database is offline.
                    type: integer
                    example: 123456
                  committed_update_seq:
                    description: >-
                      The last sequence number that was committed to the
                      database.


                      Will return 0 if the database is offline.
                    type: integer
                    example: 123456
                  instance_start_time:
                    description: >-
                      Timestamp of when the database opened, in microseconds
                      since the Unix epoch.
                    type: integer
                    example: 1644600082279583
                  compact_running:
                    description: >-
                      Indicates whether database compaction is currently taking
                      place or not.
                    type: boolean
                  purge_seq:
                    description: Unused field.
                    type: number
                    default: 0
                  disk_format_version:
                    description: Unused field.
                    type: number
                    default: 0
                  state:
                    allOf:
                      - description: The state of the database.
                        type: string
                        enum:
                          - Online
                          - Offline
                          - Starting
                          - Stopping
                          - Resyncing
                        x-enumDescriptions:
                          Online: The database is online and available for use.
                          Offline: >-
                            The database is offline, resync and other offline
                            only endpoints are allowed.
                          Starting: The database is in the process of going online.
                          Stopping: >-
                            The database is no longer accepting connections and
                            is being taken offline or deleted.
                          Resyncing: >-
                            The database is offline and performing a resync
                            operation.
                  server_uuid:
                    description: Unique server identifier.
                    type: string
                    example: 995618a6a6cc9ac79731bd13240e19b5
        '404':
          description: Resource could not be found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
              example:
                error: not_found
                reason: no such database "invalid-db"
    head:
      summary: Check if database exists
      operationId: head_db-
      tags:
        - Database Management
      description: Check if a database exists by using the response status code.
      responses:
        '200':
          description: Database exists
        '404':
          description: Resource could not be found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
              example:
                error: not_found
                reason: no such database "invalid-db"
  /:
    get:
      summary: Get server information
      operationId: get_-
      tags:
        - Server
      description: Returns information about the Sync Gateway node.
      responses:
        '200':
          description: Returned server information
          content:
            application/json:
              schema:
                type: object
                properties:
                  ADMIN:
                    description: >-
                      `true` if the request is from the Admin API - otherwise
                      omitted.
                    type: boolean
                    example: true
                  couchdb:
                    description: CouchDB welcome
                    type: string
                    example: Welcome
                  vendor:
                    allOf:
                      - description: Product vendor
                        type: object
                        properties:
                          name:
                            description: Product name
                            type: string
                            example: Couchbase Sync Gateway
                          version:
                            description: |-
                              API version.
                              Omitted if `api.hide_product_version=true`
                            type: string
                            example: 3.1
                        required:
                          - name
                        title: Vendor
                  version:
                    description: >-
                      Product version, including the build number and edition
                      (i.e. `EE` or `CE`)

                      Omitted if `api.hide_product_version=true`
                    type: string
                    example: Couchbase Sync Gateway/3.1.0(1;a765231) EE
                  persistent_config:
                    description: >-
                      Indication for whether sync gateway is running in
                      persistent config mode or legacy config mode.

                      `true` if the sync gateway node is running in persistent
                      config mode.
                    type: boolean
                    example: true
                required:
                  - couchdb
                  - vendor
    head:
      summary: Check if server online
      operationId: head_-
      tags:
        - Server
      description: Check if the server is online by checking the status code of response.
      responses:
        '200':
          description: Server is online
  /_ping:
    get:
      summary: Check if API is available
      operationId: get__ping
      tags:
        - Server
      description: Returns OK status if API is available.
      responses:
        '200':
          description: Returned status
          content:
            text/plain:
              schema:
                type: string
              example: OK
  '/{keyspace}/':
    parameters:
      - name: keyspace
        in: path
        required: true
        schema:
          type: string
        examples:
          default:
            summary: Default scope and collection
            value: db1
            description: Default scope and collection
          namedInDefault:
            summary: Named collection within the default scope
            value: db1.collection1
            description: Named collection within the default scope
          fullyQualified:
            summary: Fully-qualified scope and collection
            value: db1.scope1.collection1
            description: Fully-qualified scope and collection
        description: >-
          The keyspace to run the operation against.


          A keyspace is a dot-separated string, comprised of a database name,
          and optionally a named scope and collection.
    post:
      summary: Create a new document
      operationId: post_keyspace-
      tags:
        - Document
      description: |-
        Create a new document in the keyspace.

        This will generate a random document ID unless specified in the body.

        A document can have a maximum size of 20MB.
      parameters:
        - name: roundtrip
          in: query
          required: false
          schema:
            type: boolean
          description: Block until document has been received by change cache
      requestBody:
        content:
          application/json:
            schema:
              description: The configurable Sync Gateway properties of a document.
              type: object
              additionalProperties: true
              properties:
                _id:
                  description: The ID of the document.
                  type: string
                _rev:
                  description: The revision of the document.
                  type: string
                _exp:
                  description: >-
                    Expiry time after which the document will be purged. The
                    expiration time is set and managed on the Couchbase Server
                    document. The value can be specified in two ways; in
                    ISO-8601 format, for example the 6th of July 2022 at 17:00
                    in the BST timezone would be `2016-07-06T17:00:00+01:00`; it
                    can also be specified as a numeric Couchbase Server expiry
                    value. Couchbase Server expiry values are specified as Unix
                    time, and if the desired TTL is below 30 days then it can
                    also represent an interval in seconds from the current time
                    (for example, a value of 5 will remove the document 5
                    seconds after it is written to Couchbase Server). The
                    document expiration time is returned in the response of `GET
                    /{db}/{doc} ` when `show_exp=true` is included in the query.


                    As with the existing explicit purge mechanism, this applies
                    only to the local database; it has nothing to do with
                    replication. This expiration time is not propagated when the
                    document is replicated. The purge of the document does not
                    cause it to be deleted on any other database.
                  type: string
                _deleted:
                  description: >-
                    Whether the document is a tombstone or not. If true, it is a
                    tombstone.
                  type: boolean
                _revisions:
                  type: object
                  properties:
                    start:
                      description: Prefix number for the latest revision.
                      type: number
                    ids:
                      description: >-
                        Array of valid Revision Tree IDs, in reverse order
                        (latest first).
                      type: array
                      items:
                        type: string
                _attachments:
                  type: object
                  additionalProperties:
                    x-additionalPropertiesName: attachmentname
                    description: The name of the attachment.
                    type: object
                    properties:
                      content_type:
                        description: Content type of the attachment.
                        type: string
                      data:
                        description: The data in the attachment in base64.
                        type: string
      responses:
        '200':
          description: New document revision created successfully.
          headers:
            Etag:
              schema:
                type: string
              description: The revision ID of the newly created document.
            Location:
              schema:
                type: string
              description: The document ID of the newly created document.
          content:
            application/json:
              schema:
                description: Properties returned when a new document revision is created
                type: object
                properties:
                  id:
                    description: The ID of the document.
                    type: string
                  ok:
                    description: Whether the request completed successfully.
                    type: boolean
                  rev:
                    description: The Revision Tree ID of the document.
                    type: string
                  cv:
                    description: The CV of the document.
                    type: string
                required:
                  - id
                  - ok
                  - rev
                title: New-revision
        '400':
          description: There was a problem with your request
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
        '404':
          description: Resource could not be found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
              example:
                error: not_found
                reason: no such database "invalid-db"
        '409':
          description: Resource already exists under that name
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
        '415':
          description: Invalid content type
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
  '/{db}/_design/{ddoc}':
    x-capella: false
    parameters:
      - name: db
        in: path
        required: true
        schema:
          type: string
        example: db1
        description: The name of the database to run the operation against.
      - name: ddoc
        in: path
        required: true
        schema:
          type: string
        description: The design document name.
    get:
      summary: Get views of a design document | Unsupported
      operationId: get_db-_design-ddoc
      tags:
        - Unsupported
      description: |-
        **This is unsupported**

        Query a design document.
      responses:
        '200':
          description: Successfully returned design document.
          content:
            application/json:
              schema:
                description: Properties of a design document
                type: object
                properties:
                  language:
                    type: string
                  views:
                    type: object
                    additionalProperties:
                      x-additionalPropertiesName: viewname
                      description: The name of the view.
                      type: object
                      properties:
                        map:
                          type: string
                        reduce:
                          type: string
                  options:
                    type: object
                    properties:
                      local_seq:
                        type: string
                      include_design:
                        type: string
                      raw:
                        type: string
                      index_xattr_on_deleted_docs:
                        type: string
        '403':
          description: >-
            Forbidden access possibly due to not using the Admin API or the
            design document is a built-in Sync Gateway one.
        '404':
          description: Resource could not be found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
              example:
                error: not_found
                reason: no such database "invalid-db"
    put:
      summary: Update views of a design document | Unsupported
      description: |-
        **This is unsupported**

        Update the views of a design document.
      requestBody:
        content:
          application/json:
            schema:
              description: Properties of a design document
              type: object
              properties:
                language:
                  type: string
                views:
                  type: object
                  additionalProperties:
                    x-additionalPropertiesName: viewname
                    description: The name of the view.
                    type: object
                    properties:
                      map:
                        type: string
                      reduce:
                        type: string
                options:
                  type: object
                  properties:
                    local_seq:
                      type: string
                    include_design:
                      type: string
                    raw:
                      type: string
                    index_xattr_on_deleted_docs:
                      type: string
      operationId: put_db-_design-ddoc
      tags:
        - Unsupported
      responses:
        '200':
          description: Design document changes successfully
        '403':
          description: >-
            Forbidden access possibly due to not using the Admin API or the
            design document is a built-in Sync Gateway one.
        '404':
          description: Resource could not be found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
              example:
                error: not_found
                reason: no such database "invalid-db"
    delete:
      summary: Delete a design document | Unsupported
      operationId: delete_db-_design-ddoc
      tags:
        - Unsupported
      description: |-
        **This is unsupported**

        Delete a design document.
      responses:
        '200':
          description: Design document deleted successfully
        '403':
          description: >-
            Forbidden access possibly due to not using the Admin API or the
            design document is a built-in Sync Gateway one.
        '404':
          description: Resource could not be found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
              example:
                error: not_found
                reason: no such database "invalid-db"
    head:
      summary: Check if view of design document exists | Unsupported
      operationId: head_db-_design-ddoc
      tags:
        - Unsupported
      description: |-
        **This is unsupported**

        Check if a design document can be queried.
      responses:
        '200':
          description: Design document exists
        '403':
          description: >-
            Forbidden access possibly due to not using the Admin API or the
            design document is a built-in Sync Gateway one.
        '404':
          description: Resource could not be found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    description: The error name.
                    type: string
                  reason:
                    description: The error description.
                    type: string
                required:
                  - error
                  - reason
                title: HTTP-Error
              example:
                error: not_found
                reason: no such database "invalid-db"
  '/{db}/_design/{ddoc}/_view/{view}':
    x-capella: false
    parameters:
      - name: db
        in: path
        required: true
        schema:
          type: string
        example: db1
        description: The name of the database to run the operation against.
      - name: ddoc
        in: path
        required: true
        schema:
          type: string
        description: The design document name.
      - name: view
        in: path
        required: true
        schema:
          type: string
        description: The view to target.
    get:
      summary: Query a view on a design document | Unsupported
      operationId: get_db-_design-ddoc-_view-view
      tags:
        - Unsupported
      description: |-
        **This is unsupported**

        Query a view on a design document.
      parameters:
        - name: inclusive_end
          in: query
          required: false
          description: >-
