            type: string
          description: >-
            An optimistic concurrency control (OCC) value used to prevent
            conflicts. Use the value returned in the ETag response header of the
            GET request for the resource being updated, or the latest known
            Revision Tree ID or Current Version of the document.
      requestBody:
        content:
          application/json:
            schema:
              description: The configurable Sync Gateway properties of a document.
              type: object
              additionalProperties: true
              properties:
                _id:
                  description: The ID of the document.
                  type: string
                _rev:
                  description: The revision of the document.
                  type: string
                _exp:
                  description: >-
                    Expiry time after which the document will be purged. The
                    expiration time is set and managed on the Couchbase Server
                    document. The value can be specified in two ways; in
                    ISO-8601 format, for example the 6th of July 2022 at 17:00
                    in the BST timezone would be `2016-07-06T17:00:00+01:00`; it
                    can also be specified as a numeric Couchbase Server expiry
                    value. Couchbase Server expiry values are specified as Unix
                    time, and if the desired TTL is below 30 days then it can
                    also represent an interval in seconds from the current time
                    (for example, a value of 5 will remove the document 5
                    seconds after it is written to Couchbase Server). The
                    document expiration time is returned in the response of `GET
                    /{db}/{doc} ` when `show_exp=true` is included in the query.


